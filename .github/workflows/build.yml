name: Final Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -q *.zip -d temp_project || true
        cp -r temp_project/*/* ./ || cp -r temp_project/* ./ || true

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Fix Duplicate Resources
      run: |
        find . -name "styles.xml" -type f -delete || true

    - name: Purge Broken Gradle Wrapper
      run: |
        PROJECT_PATH=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$PROJECT_PATH" ]; then PROJECT_PATH="."; fi
        cd "$PROJECT_PATH"
        
        rm -rf gradle/wrapper/gradle-wrapper.properties
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

    - name: Build APK Final
      run: |
        PROJECT_PATH=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$PROJECT_PATH" ]; then PROJECT_PATH="."; fi
        cd "$PROJECT_PATH"
        
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Final APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: HumanitarianAidManager-APK
        path: '**/*.apk'
