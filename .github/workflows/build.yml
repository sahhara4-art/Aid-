name: Build APK Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean previous projects
      run: rm -rf my_project

    - name: Unzip the LATEST uploaded ZIP file
      run: |
        latest_zip=$(ls -t *.zip | head -1)
        unzip -q "$latest_zip" -d my_project/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix duplicate resources and Build APK
      run: |
        # البحث التلقائي عن المجلد الداخلي الذي يحتوي على المشروع
        PROJECT_ROOT=$(dirname $(find my_project -name "gradlew" | head -1))
        echo "Project root found at: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        # حذف الملف المكرر لتجنب الأخطاء السابقة
        rm -f app/src/main/res/values/styles.xml
        
        # بناء التطبيق
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload final APK
      uses: actions/upload-artifact@v4
      with:
        name: HumanitarianAid-Ready
        # البحث عن ملف الـ APK النهائي في أي مجلد فرعي
        path: my_project/**/app/build/outputs/apk/debug/*.apk
