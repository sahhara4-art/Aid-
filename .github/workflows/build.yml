name: Final Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -q *.zip -d temp_project || true
        cp -r temp_project/*/* ./ || cp -r temp_project/* ./ || true

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Fix Duplicate Resources
      run: |
        find . -name "styles.xml" -type f -delete || true

    - name: Build APK Clean
      run: |
        PROJECT_PATH=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        if [ -z "$PROJECT_PATH" ]; then PROJECT_PATH="."; fi
        cd "$PROJECT_PATH"
        
        chmod +x gradlew
        ./gradlew clean assembleDebug --stacktrace --no-daemon

    - name: Upload Final APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: HumanitarianAidManager-APK
        path: '**/*.apk'
