name: Build APK Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean previous projects
      run: rm -rf my_project

    - name: Unzip the LATEST uploaded ZIP file
      run: |
        latest_zip=$(ls -t *.zip | head -1)
        echo "Unzipping $latest_zip..."
        unzip -q "$latest_zip" -d my_project/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix errors and Build APK
      run: |
        # التأكد من مسار المشروع المفقوك
        PROJECT_ROOT=$(find my_project -name "settings.gradle*" -o -name "build.gradle*" | head -1 | xargs dirname)
        if [ -z "$PROJECT_ROOT" ]; then
          PROJECT_ROOT="my_project"
        fi
        cd "$PROJECT_ROOT"
        
        # حذف الملفات المكررة فقط إن وجدت لتجنب التعارض
        rm -f app/src/main/res/values/styles.xml
        rm -f app/src/main/java/com/humanitarian/aidmanagement/util/ExcelParserHelper.kt
        rm -f app/src/main/java/com/humanitarian/aidmanagement/data/local/dao/AidDaos.kt
        
        # إصلاح مشكلة الأيقونة إن وجدت
        if [ -f "app/src/main/AndroidManifest.xml" ]; then
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@android:drawable\/sym_def_app_icon"/g' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' app/src/main/AndroidManifest.xml
        fi
        
        # بناء التطبيق بأكوادك الكاملة
        chmod +x gradlew
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload final APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: HumanitarianAid-Ready
        path: |
          **/*/build/outputs/apk/debug/*.apk
