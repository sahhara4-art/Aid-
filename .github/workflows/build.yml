name: Build Humanitarian Aid Manager Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Prepare Project
      run: |
        # فك الضغط إذا كان هناك ملف ZIP
        if ls *.zip 1> /dev/null 2>&1; then
          echo "تم العثور على ملف ZIP، جاري فك الضغط..."
          unzip -q *.zip -d extracted_project
          cp -r extracted_project/*/* ./ || cp -r extracted_project/* ./
        fi

        # البحث الذكي عن مسار المشروع الحقيقي (مكان وجود settings.gradle.kts)
        ROOT_DIR=$(dirname $(find . -name "settings.gradle.kts" | head -n 1))
        if [ -z "$ROOT_DIR" ]; then
          ROOT_DIR="."
        fi
        echo "PROJECT_ROOT=$ROOT_DIR" >> $GITHUB_ENV
        echo "تم تحديد مسار المشروع في: $ROOT_DIR"

    - name: AI Smart Cleanup
      run: |
        cd ${{ env.PROJECT_ROOT }}
        echo "جاري تنظيف الكود من الرموز العشوائية والملفات المكررة..."
        find . -type f -name "*.kt" -exec sed -i '/h9q8u0ickgxZDWZoMyeljZAgcflFp9ZIdGxad68LJDL17ihwy/d' {} +
        rm -f app/src/main/res/values/styles.xml
        rm -f app/src/main/java/com/humanitarian/aidmanagement/util/ExcelParserHelper.kt
        rm -f app/src/main/java/com/humanitarian/aidmanagement/data/local/dao/AidDaos.kt
        rm -rf app/build .gradle app/.cxx app/build/generated

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build and Compile APK
      run: |
        cd ${{ env.PROJECT_ROOT }}
        
        # توليد ملف gradlew تلقائياً في حال كان مفقوداً
        if [ ! -f "gradlew" ]; then
          echo "ملف gradlew مفقود، جاري توليده الآن..."
          gradle wrapper --gradle-version 8.4
        fi
        
        chmod +x gradlew || true
        # البناء النظيف
        ./gradlew clean assembleDebug --stacktrace --no-daemon

    - name: Upload Final Ready APK
      uses: actions/upload-artifact@v4
      with:
        name: HumanitarianAidManager-Final-APK
        path: |
          ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
