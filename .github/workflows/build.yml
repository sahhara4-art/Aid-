name: Build Humanitarian Aid Manager Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project File
      run: |
        # البحث عن الملف المضغوط وفك ضغطه في المجلد الحالي
        if ls *.zip 1> /dev/null 2>&1; then
          echo "تم العثور على ملف ZIP، جاري فك الضغط..."
          unzip -q *.zip -d extracted_project
          # نقل الملفات المستخرجة إلى المسار الرئيسي
          cp -r extracted_project/*/* ./ || cp -r extracted_project/* ./
          rm -rf extracted_project
        fi

    - name: AI Smart Cleanup (Fix Duplicates & Corrupted Code)
      run: |
        echo "جاري تنظيف الكود من الرموز العشوائية..."
        find . -type f -name "*.kt" -exec sed -i '/h9q8u0ickgxZDWZoMyeljZAgcflFp9ZIdGxad68LJDL17ihwy/d' {} +
        
        echo "جاري حذف الملفات المكررة لمنع التعارض..."
        rm -f app/src/main/res/values/styles.xml
        rm -f app/src/main/java/com/humanitarian/aidmanagement/util/ExcelParserHelper.kt
        rm -f app/src/main/java/com/humanitarian/aidmanagement/data/local/dao/AidDaos.kt
        
        echo "جاري تنظيف الكاش الخاص بقواعد بيانات KSP و Room..."
        rm -rf app/build .gradle app/.cxx app/build/generated

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build and Compile APK
      run: |
        # التأكد من صلاحيات البناء
        chmod +x gradlew || true
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew || true
        
        # تنفيذ بناء نظيف بالكامل من الصفر
        ./gradlew clean assembleDebug --stacktrace --no-daemon

    - name: Upload Final Ready APK
      uses: actions/upload-artifact@v4
      with:
        name: HumanitarianAidManager-Final-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/debug/*.apk
