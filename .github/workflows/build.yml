    - name: Build and Catch Hidden Error
      run: |
        cd ${{ env.PROJECT_ROOT }}
        chmod +x gradlew || true
        
        echo "جاري بناء التطبيق بصمت للبحث عن الخطأ الحقيقي..."
        ./gradlew clean assembleDebug --no-daemon -x lint -x test > build_error_log.txt 2>&1 || B_FAILED=true
        
        if [ "$B_FAILED" = true ]; then
          echo "========================================================="
          echo "🔴 السجل الكامل لسبب الفشل 🔴"
          echo "========================================================="
          tail -n 100 build_error_log.txt
          echo "========================================================="
          exit 1
        fi
