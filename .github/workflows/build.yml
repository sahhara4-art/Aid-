name: Build APK Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean previous projects
      run: rm -rf my_project

    - name: Unzip the LATEST uploaded ZIP file
      run: |
        latest_zip=$(ls -t *.zip | head -1)
        echo "Unzipping $latest_zip..."
        unzip -q "$latest_zip" -d my_project/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix duplicate resources and Build APK
      run: |
        echo "--- عرض محتويات المجلد للتحقق ---"
        find my_project -maxdepth 3
        echo "--------------------------------"
        
        # البحث عن ملف settings.gradle أو settings.gradle.kts
        SETTINGS_FILE=$(find my_project -name "settings.gradle*" | head -1)
        
        if [ -z "$SETTINGS_FILE" ]; then
          echo "خطأ: لم يتم العثور على ملف إعدادات جاردل. يبدو أن الملف المضغوط ناقص."
          exit 1
        fi
        
        PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
        echo "تم العثور على ملفات البناء في: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        # حذف الملف المكرر لتجنب الأخطاء السابقة
        rm -f app/src/main/res/values/styles.xml
        
        # إعطاء الصلاحيات وبناء التطبيق
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload final APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: HumanitarianAid-Ready
        path: my_project/**/app/build/outputs/apk/debug/*.apk
